<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix Clone</title>

  <link rel="stylesheet" href="styles.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: white;
      overflow-x: hidden;
    }

    .nav {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
    }

    .nav img {
      height: 40px;
      object-fit: contain;
    }

    .banner {
      height: 90vh;
      background-size: cover;
      background-position: center center;
      display: flex;
      align-items: center;
      padding: 0 50px;
      position: relative;
    }

    .banner::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 200px;
      background: linear-gradient(
        180deg,
        transparent,
        rgba(17,17,17,0.8),
        #111
      );
    }

    .banner-content {
      max-width: 500px;
      z-index: 2;
    }

    .banner h1 {
      font-size: 4rem;
      margin-bottom: 20px;
    }

    .banner p {
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .buttons button {
      padding: 12px 25px;
      border: none;
      margin-right: 10px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 5px;
      transition: 0.3s;
    }

    .play-btn {
      background: white;
      color: black;
    }

    .list-btn {
      background: rgba(109,109,110,0.7);
      color: white;
    }

    .buttons button:hover {
      opacity: 0.8;
      transform: scale(1.05);
    }

    .row {
      margin-top: 30px;
      padding-left: 30px;
    }

    .row h2 {
      margin-bottom: 15px;
    }

    .posters {
      display: flex;
      overflow-x: auto;
      gap: 12px;
      scroll-behavior: smooth;
      padding-bottom: 10px;
    }

    .posters::-webkit-scrollbar {
      display: none;
    }

    .poster {
      width: 200px;
      border-radius: 8px;
      transition: transform 0.3s;
      cursor: pointer;
      object-fit: cover;
    }

    .poster:hover {
      transform: scale(1.08);
    }

    @media (max-width: 768px) {
      .banner h1 {
        font-size: 2.5rem;
      }

      .poster {
        width: 140px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="nav">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" />
    
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" />
  </nav>

  <!-- BANNER -->
  <header class="banner"
    style="background-image:url('https://image.tmdb.org/t/p/original/hVMoqvXs5j9ffun56tZ5YhliSD9.jpg')">

    <div class="banner-content">
      <h1>Ginny & Georgia</h1>

      <div class="buttons">
        <button class="play-btn">▶ Play</button>
        <button class="list-btn">+ My List</button>
      </div>

      <p>
        Angsty and awkward fifteen year old Ginny Miller often feels
        more mature than her thirty year old mother Georgia.
      </p>
    </div>
  </header>

  <!-- MOVIE ROW -->
  <section class="row">
    <h2>Trending Now</h2>

    <div class="posters" id="trending"></div>
  </section>

  <section class="row">
    <h2>Top Rated</h2>

    <div class="posters" id="topRated"></div>
  </section>

  <script>
    const trendingMovies = [
      "6ELCZlTA5lGUops70hKdB83WJxH.jpg",
      "gUttUEqsrvaMlK5oL5TSQ54iE96.jpg",
      "ouOojiypBE6CD1aqcHPVq7cJf2R.jpg",
      "jedggylU3FyIN7XRAl9WY8mrT6H.jpg"
    ];

    const topRatedMovies = [
      "gNBCvtYyGPbjPCT1k3MvJuNuXR6.jpg",
      "iNh3BivHyg5sQRPP1KOkzguEX0H.jpg",
      "jtAI6OJIWLWiRItNSZoWjrsUtmi.jpg"
    ];

    function renderMovies(containerId, movies) {
      const container = document.getElementById(containerId);

      movies.forEach(movie => {
        const img = document.createElement("img");

        img.src = `https://image.tmdb.org/t/p/original/${movie}`;
        img.className = "poster";
        img.loading = "lazy";

        container.appendChild(img);
      });
    }

    renderMovies("trending", trendingMovies);
    renderMovies("topRated", topRatedMovies);
  </script>

</body>
</html>
